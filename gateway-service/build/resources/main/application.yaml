spring:
  application:
    name: gateway-service
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: category-route
          uri: lb://category-service
          predicates:
            - Path=/api/greeting/**, /api/categories/**
        - id: product-route
          uri: lb://product-service
          predicates:
            - Path=/api/products/**
        - id: order-route
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
        - id: payment-route
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**